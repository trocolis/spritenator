# =============================================================================
# Integração contínua: compila e testa o Spritenator em Linux, Windows e
# macOS a cada push/pull request, tratando avisos do compilador como erros.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true

      - name: Configurar
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DSPRITENATOR_WARNINGS_AS_ERRORS=ON

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Testar
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Empacotar
        working-directory: build
        run: cpack -C Release

      - name: Publicar pacote
        uses: actions/upload-artifact@v4
        with:
          name: spritenator-${{ matrix.os }}
          path: |
            build/*.zip
            build/*.tar.gz
            build/*.dmg
          if-no-files-found: ignore
